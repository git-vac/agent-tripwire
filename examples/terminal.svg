text{font-family:system-ui,Segoe UI,sans-serif;fill:#efede8;font-variant-numeric:tabular-nums}
.mono{font-family:Consolas,Menlo,monospace}.meta{fill:#b0aea7}.rule{stroke:#383632}.proof{fill:#f0be77}
</style>
