[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tripwire"
version = "0.4.0"
description = "Evidence-driven prompt injection tests for tool-using assistants."
requires-python = ">=3.10"
dependencies = ["rich>=13.7,<16"]
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
application = ["mcp==1.30.0"]

[project.scripts]
agent-tripwire = "agent_tripwire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
