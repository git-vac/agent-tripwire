name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: agent-tripwire --version
      - run: python -m pip install ".[application]"
      - run: python -m unittest discover -s tests -v
      - run: python examples/application_experiment.py --output reports/application-experiment
      - run: agent-tripwire report reports/application-experiment/enforce.json --junit reports/application-results.xml
      - run: agent-tripwire list --scenario-file examples/custom-scenarios.json
      - run: python -c "import subprocess; assert subprocess.call(['agent-tripwire', 'demo', '--html', 'reports/demo.html', '--json', 'reports/demo.json']) == 1"
      - run: agent-tripwire demo --policy enforce --json reports/enforced.json --junit reports/enforced.xml
      - run: agent-tripwire compare reports/demo.json reports/enforced.json --html reports/comparison.html
      - run: agent-tripwire report reports/enforced.json --only attention --html reports/attention.html
      - run: python -c "import subprocess; assert subprocess.call(['agent-tripwire', 'report', 'reports/demo.json', '--scenario', 'control', '--junit', 'reports/demo.xml']) == 1"
